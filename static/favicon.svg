<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="pad" x1="8" y1="14" x2="56" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="64" height="64" rx="14" fill="#08060f"/>

  <!-- Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Gamepad-Body, aus Pixel-Blöcken aufgebaut (8bit-Look) -->
  <g fill="url(#pad)">
    <rect x="16" y="20" width="32" height="8" />
    <rect x="10" y="28" width="44" height="12" />
    <rect x="14" y="40" width="10" height="6" />
    <rect x="40" y="40" width="10" height="6" />
  </g>

  <!-- D-Pad (Kreuz), als Aussparung in Hintergrundfarbe -->
  <g fill="#08060f">
    <rect x="18" y="31" width="4" height="10" />
    <rect x="15" y="34" width="10" height="4" />
  </g>

  <!-- Action-Buttons -->
  <g fill="#08060f">
    <rect x="38" y="31" width="4" height="4" />
    <rect x="44" y="35" width="4" height="4" />
  </g>
</svg>
