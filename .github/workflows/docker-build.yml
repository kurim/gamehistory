name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags, needed for `git describe` to find the
          # nearest release tag below.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine app version and image tags
        id: meta
        run: |
          # Exactly on a release tag (vX.Y.Z push) -> "vX.Y.Z".
          # Commits since the last tag -> "vX.Y.Z-N-gSHA" (git describe's own format).
          # No tags in the repo yet -> falls back to the short commit sha.
          version=$(git describe --tags --always)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # `latest` always tracks main's HEAD (bleeding edge). A `vX.Y.Z`
          # push additionally publishes an immutable tag pinned to that
          # release plus a floating `stable` tag that always points at the
          # most recently released version — but never touches `latest`
          # itself, since tags aren't necessarily cut from main's current
          # HEAD and `latest` should only ever move forward with it.
          #
          # Deliberately NOT tagging every push with the raw commit sha —
          # that tag would never get cleaned up and just accumulates
          # forever in the registry (see the "cleanup" job below for the
          # untagged-attestation counterpart of the same problem).
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          ${{ env.IMAGE_NAME }}:stable"
          else
            tags="${{ env.IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without these, buildx auto-attaches a provenance/SBOM attestation
          # manifest to every push, which shows up in GHCR as an untagged,
          # unreferenced "version" that never gets cleaned up — that's most
          # of what the cleanup job below prunes away.
          provenance: false
          sbom: false

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
